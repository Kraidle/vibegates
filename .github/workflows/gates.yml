# VibeGates applied to itself — docs-repo profile (see docs/04-adoption-profiles.md).
# Every job is BLOCKING. No continue-on-error (framework invariant).
# Scope, declared honestly: this documentation repository mechanizes G1 (model
# pinning over the .claude/ pack), G3 (credential floor), G5 (naked debt
# markers) and G6 (no copyrighted full texts). gate-gist is deliberately NOT
# wired here (docs repo: markdown is out of the guard's declared scope) while
# adopters get it in templates/ci-gates.yml g5 — asymmetry recorded. G2/P3
# (review & understanding) remain human obligations made checkable via PRs.

name: gates
on:
  push:
    branches: [main]
  pull_request:

jobs:
  g1-model-pinning:
    name: g1-pinned-models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pinned model identifiers only (R-1/R-4, ADR-0002)
        # Guards the .claude/ agent & skill pack: a bare tier resolves to whatever
        # the platform decides at call time (measured 2026-08-05). Live-fire tested
        # 2026-08-13 across three rounds (23 fixture runs, both ports) — the G2 review
        # caught and reproduced 2 real defects between rounds (exception-boundary
        # fail-open; whole-file scan); both fixed and re-proven. See docs/passes/pass-2-report.md.
        run: bash enforcement/lint-model-pinning.sh .
  g3-secrets:
    name: g3-no-credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Credential-shaped content forbidden (regex floor; live-fire evidence in docs/passes/pass-4-report.md)
        run: bash enforcement/gate-secrets.sh --tree
  guards-selftest:
    name: guards-acceptance-set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the committed guard acceptance set (the contract, executable — 39 fixtures)
        run: bash enforcement/tests/run-fixtures.sh
  g5-debt:
    name: g5-no-naked-todo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Naked TODO/FIXME markers forbidden (R-13)
        # Pattern targets actual markers (TODO:/FIXME:), not prose discussing them.
        # The checker files (this workflow, the enforcement scripts) name the markers
        # in their own block messages and are excluded from their own scan.
        run: |
          if git grep -nE '\b(TODO|FIXME):' -- ':!.github/workflows/gates.yml' ':!enforcement/'; then
            echo '::error::Naked TODO/FIXME marker found. Handle via debt register + ADR, or resolve (R-13).'
            exit 1
          fi
          echo "OK: no naked debt markers."

  g6-compliance:
    name: g6-no-copyrighted-pdfs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No PDFs / paywalled documents in the repository (CONTRIBUTING §6)
        run: |
          if git ls-files | grep -iE '\.pdf$'; then
            echo '::error::PDF committed. Cite with DOI/links; never commit papers or standards.'
            exit 1
          fi
          echo "OK: no committed PDFs."
